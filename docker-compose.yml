services:
  postgres:
    image: postgres:17-alpine
    container_name: interior-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interior_demo}
      POSTGRES_USER: ${POSTGRES_USER:-interior_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - interior_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interior_demo} -d ${POSTGRES_DB:-interior_demo}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  interior_demo_pgdata:
